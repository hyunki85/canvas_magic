apply plugin: 'com.android.application'
apply from: '../config/quality/quality.gradle'
apply plugin: 'jacoco'
apply plugin: 'com.github.ben-manes.versions'
//apply plugin: 'io.fabric'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    bundle {
        language {
            enableSplit = false
        }
    }
    buildFeatures {
        compose true
        buildConfig true
        dataBinding true
    }
    defaultConfig {
        defaultPublishConfig 'debug'

        applicationId "com.h2play.canvas_magic"
        minSdkVersion 25
        targetSdkVersion 36
        testInstrumentationRunner "${applicationId}.runner.RxAndroidJUnitRunner"
        versionCode 1002003
        // Major -> Millions, Minor -> Thousands, Bugfix -> Hundreds. E.g 1.3.72 == 1,003,072
        versionName '1.2.3'

        buildConfigField("String", "POKEAPI_API_URL",
                "\"${PokeapiApiUrl}\"")
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file("key/upload.jks")
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            multiDexEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        def commonTestDir = 'src/commonTest/java'
        test {
            java.srcDir commonTestDir
        }
        androidTest {
            java.srcDir commonTestDir
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/services/javax.annotation.processing.Processor', 'LICENSE.txt', 'META-INF/license/LICENSE.base64.txt', 'META-INF/NOTICE.txt', 'META-INF/LICENSE.txt', 'META-INF/rxjava.properties']
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                jacoco {
                    includeNoLocationClasses = true
                }
            }
        }
    }
    lint {
        abortOnError false
        checkAllWarnings true
        explainIssues true
        lintConfig file("$projectDir/lint.xml")
        showAll true
        textOutput file('stdout')
        textReport true
        warningsAsErrors true
    }
    namespace 'com.h2play.canvas_magic'
}

// 오래된 Okio/OkHttp 강제 버전 설정 제거 - Firebase 26.x는 Okio 3.x가 필요함


apply from: 'dependencies.gradle'
apply plugin: 'com.google.gms.google-services'

dependencies {

    implementation networkLibs
    implementation rxJavaLibs

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.github.madrapps:pikolo:1.1.6'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'com.f2prateek.dart:dart:2.0.2'
    
    // Firebase BoM (Bill of Materials) - 모든 Firebase 라이브러리 버전을 자동으로 관리
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    
    // Firebase Analytics (firebase-core는 deprecated)
    implementation 'com.google.firebase:firebase-analytics'
    
    // Firebase 서비스들 (BoM이 버전 관리)
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-config'
    
    // Google Mobile Ads SDK (firebase-ads는 deprecated)
    implementation 'com.google.android.gms:play-services-ads:24.1.0'
    
    annotationProcessor 'com.f2prateek.dart:dart-processor:2.0.2'

    // QuadFlask colorpicker 제거 - Pikolo로 대체됨
    // implementation 'com.github.QuadFlask:colorpicker:0.0.13'

    implementation 'jp.wasabeef:glide-transformations:4.3.0'


    implementation 'com.google.code.gson:gson:2.11.0'

    implementation "com.jakewharton.timber:timber:4.5.1"
    implementation "com.facebook.stetho:stetho-okhttp3:1.5.0"

    debugImplementation 'com.readystatesoftware.chuck:library:1.0.4'
    releaseImplementation 'com.readystatesoftware.chuck:library-no-op:1.0.4'

    debugImplementation('com.github.ajitsing:sherlock:1.0.2@aar') {
        transitive = true
    }
    releaseImplementation('com.github.ajitsing:sherlock-no-op:1.0.2@aar')

    implementation "com.google.dagger:dagger:$versions.dagger"
    annotationProcessor "com.google.dagger:dagger-compiler:$versions.dagger"
    compileOnly 'org.glassfish:javax.annotation:10.0-b28' //Required by Dagger2

    //debugImplementation leakCannary
//    releaseImplementation leakCannary
//    testImplementation leakCannary

    testImplementation unitTestLibs
    androidTestImplementation androidTestsLibs
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    
    // Firebase Firestore와 Auth (BoM이 버전 관리)
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-auth'

    implementation "com.vorlonsoft:androidrate:1.2.1"
    implementation "androidx.work:work-runtime:2.10.0" // java
    implementation "androidx.gridlayout:gridlayout:1.1.0"
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Log out test results to console
tasks.matching { it instanceof Test }.all {
    testLogging.events = ["failed", "passed", "skipped"]
}
